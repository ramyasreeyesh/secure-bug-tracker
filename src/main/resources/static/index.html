<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bug Tracker</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --danger: #ef4444;
    --success: #22c55e;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 20px 30px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { margin: 0; font-size: 20px; }
  #userInfo { color: var(--muted); font-size: 14px; }
  #userInfo button {
    margin-left: 12px;
    background: var(--danger);
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 { margin-top: 0; font-size: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  input, select, textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
  }
  button.primary {
    background: var(--accent);
    border: none;
    color: white;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  button.primary:hover { background: var(--accent-hover); }
  .bug {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .bug-info h3 { margin: 0 0 4px 0; font-size: 15px; }
  .bug-info p { margin: 0; color: var(--muted); font-size: 13px; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 6px;
  }
  .badge.OPEN { background: #1e3a8a; color: #93c5fd; }
  .badge.IN_PROGRESS { background: #78350f; color: #fcd34d; }
  .badge.TESTED { background: #164e63; color: #67e8f9; }
  .badge.CLOSED { background: #14532d; color: #86efac; }
  .bug button.delete {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  #loginView { max-width: 380px; margin: 80px auto; }
  #loginView h1 { text-align: center; }
  .error { color: var(--danger); font-size: 13px; margin-bottom: 10px; }
  .hidden { display: none; }
  .empty { color: var(--muted); text-align: center; padding: 20px; }
</style>
</head>
<body>

<div id="loginView">
  <h1>🐞 Bug Tracker</h1>
  <div class="card">
    <h2 id="authModeTitle">Login</h2>
    <div class="error" id="authError"></div>
    <input id="authUsername" placeholder="Username">
    <input id="authPassword" type="password" placeholder="Password">
    <select id="authRole" class="hidden">
      <option value="REPORTER">Reporter</option>
      <option value="DEVELOPER">Developer</option>
      <option value="ADMIN">Admin</option>
    </select>
    <button class="primary" id="authSubmitBtn" onclick="login()" style="width:100%">Login</button>
    <p style="text-align:center; margin-top:14px; font-size:13px; color:var(--muted)">
      <a href="#" id="authToggleLink" onclick="toggleAuthMode(event)" style="color:var(--accent)">Need an account? Register</a>
    </p>
  </div>
</div>

<div id="appView" class="hidden">
  <header>
    <h1>🐞 Bug Tracker</h1>
    <div id="userInfo"></div>
  </header>

  <div class="container">
    <div class="card">
      <h2>Report a Bug</h2>
      <div class="error" id="createError"></div>
      <input id="bugTitle" placeholder="Title">
      <textarea id="bugDescription" placeholder="Description" rows="3"></textarea>
      <select id="bugPriority">
        <option value="LOW">Low Priority</option>
        <option value="MEDIUM" selected>Medium Priority</option>
        <option value="HIGH">High Priority</option>
        <option value="CRITICAL">Critical</option>
      </select>
      <button class="primary" onclick="createBug()">Create Bug</button>
    </div>

    <div class="card">
      <h2>Filter</h2>
      <select id="statusFilter" onchange="loadBugs()">
        <option value="">All Statuses</option>
        <option value="OPEN">Open</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="TESTED">Tested</option>
        <option value="CLOSED">Closed</option>
      </select>
    </div>

    <div class="card">
      <h2>Bugs</h2>
      <div id="bugsList"><p class="empty">Loading...</p></div>
    </div>
  </div>
</div>

<script>
const API_BASE = window.location.origin + '/api';
let token = localStorage.getItem('bt_token');
let username = localStorage.getItem('bt_username');
let role = localStorage.getItem('bt_role');
let isRegisterMode = false;

function toggleAuthMode(e) {
  e.preventDefault();
  isRegisterMode = !isRegisterMode;
  document.getElementById('authModeTitle').textContent = isRegisterMode ? 'Register' : 'Login';
  document.getElementById('authSubmitBtn').textContent = isRegisterMode ? 'Register' : 'Login';
  document.getElementById('authSubmitBtn').setAttribute('onclick', isRegisterMode ? 'register()' : 'login()');
  document.getElementById('authRole').classList.toggle('hidden', !isRegisterMode);
  document.getElementById('authToggleLink').textContent = isRegisterMode ? 'Have an account? Login' : 'Need an account? Register';
  document.getElementById('authError').textContent = '';
}

async function register() {
  const u = document.getElementById('authUsername').value.trim();
  const p = document.getElementById('authPassword').value;
  const r = document.getElementById('authRole').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if (!u || !p) { errEl.textContent = 'Username and password required.'; return; }
  try {
    const res = await fetch(`${API_BASE}/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p, role: r })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Registration failed.'; return; }
    toggleAuthMode({ preventDefault(){} });
    document.getElementById('authError').textContent = 'Registered! Please log in.';
  } catch (e) {
    errEl.textContent = 'Could not reach server.';
  }
}

async function login() {
  const u = document.getElementById('authUsername').value.trim();
  const p = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if (!u || !p) { errEl.textContent = 'Username and password required.'; return; }
  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Login failed.'; return; }
    token = data.token; username = data.username; role = data.role;
    localStorage.setItem('bt_token', token);
    localStorage.setItem('bt_username', username);
    localStorage.setItem('bt_role', role);
    showApp();
  } catch (e) {
    errEl.textContent = 'Could not reach server.';
  }
}

function logout() {
  token = null;
  localStorage.removeItem('bt_token');
  localStorage.removeItem('bt_username');
  localStorage.removeItem('bt_role');
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
}

function showApp() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('userInfo').innerHTML =
    `${username} <span class="badge OPEN">${role}</span><button onclick="logout()">Logout</button>`;
  loadBugs();
}

async function authFetch(url, options = {}) {
  options.headers = options.headers || {};
  options.headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(url, options);
  if (res.status === 401) { logout(); throw new Error('Session expired'); }
  return res;
}

async function loadBugs() {
  const status = document.getElementById('statusFilter').value;
  const url = `${API_BASE}/bugs?size=50${status ? '&status=' + status : ''}`;
  const listEl = document.getElementById('bugsList');
  try {
    const res = await authFetch(url);
    const data = await res.json();
    const bugs = data.content || [];
    if (bugs.length === 0) {
      listEl.innerHTML = '<p class="empty">No bugs found.</p>';
      return;
    }
    listEl.innerHTML = bugs.map(b => `
      <div class="bug">
        <div class="bug-info">
          <h3>${escapeHtml(b.title)}</h3>
          <p>
            <span class="badge ${b.status}">${b.status.replace('_',' ')}</span>
            Priority: ${b.priority} ${b.reportedBy ? '· by ' + escapeHtml(b.reportedBy.username) : ''}
          </p>
          ${b.description ? `<p style="margin-top:6px">${escapeHtml(b.description)}</p>` : ''}
        </div>
        ${role === 'ADMIN' ? `<button class="delete" onclick="deleteBug(${b.id})">Delete</button>` : ''}
      </div>
    `).join('');
  } catch (e) {
    listEl.innerHTML = `<p class="empty">Could not load bugs.</p>`;
  }
}

async function createBug() {
  const title = document.getElementById('bugTitle').value.trim();
  const description = document.getElementById('bugDescription').value.trim();
  const priority = document.getElementById('bugPriority').value;
  const errEl = document.getElementById('createError');
  errEl.textContent = '';
  if (!title) { errEl.textContent = 'Title is required.'; return; }
  try {
    const res = await authFetch(`${API_BASE}/bugs`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description, priority })
    });
    if (!res.ok) { errEl.textContent = 'Could not create bug.'; return; }
    document.getElementById('bugTitle').value = '';
    document.getElementById('bugDescription').value = '';
    loadBugs();
  } catch (e) {
    errEl.textContent = 'Could not reach server.';
  }
}

async function deleteBug(id) {
  if (!confirm('Delete this bug?')) return;
  try {
    const res = await authFetch(`${API_BASE}/bugs/${id}`, { method: 'DELETE' });
    if (res.ok || res.status === 204) loadBugs();
    else alert('Could not delete bug (admin only).');
  } catch (e) {
    alert('Could not reach server.');
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Auto-login if token exists
if (token && username && role) {
  showApp();
}
</script>

</body>
</html>
